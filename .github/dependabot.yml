# Weekly dependency PRs, which CI (workflows/ci.yml) tests before anyone merges.
# Minor and patch updates are grouped into one PR per folder so they don't
# arrive as a dozen separate PRs; major versions come one at a time, since
# those are the ones that need reading. Security fixes are raised as soon as
# an advisory lands, regardless of the schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
