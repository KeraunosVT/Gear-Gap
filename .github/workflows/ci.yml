# Runs on every PR and every push to main: the same install a deploy runs
# (root `npm ci` → postinstall installs backend + frontend and builds the
# frontend), then the backend test suite. A broken `vite build` fails here
# instead of on the host; a broken test fails here instead of never running.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 22, not 18: `npm test` passes a quoted glob to `node --test`, and Node
      # only expands globs there from 21 on — below that it looks for a file
      # literally named `*.test.js` and fails.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install and build (same path as a deploy)
        run: npm ci

      # Catches what the build doesn't: a component used but never imported
      # compiles fine and crashes only when that branch renders.
      - name: Lint
        run: npm run lint

      - name: Backend tests
        run: npm test

  # The standalone raid bot (raid-bot/) has its own dependencies and needs a
  # real Postgres: its signup tests race joins against row locks, which a
  # mock can't check.
  raid-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raidbot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: raid-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raid-bot/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/raidbot_test
